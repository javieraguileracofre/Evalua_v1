# Blueprint Render: https://render.com/docs/blueprint-spec
#
# Uso: Dashboard → New → Blueprint → repo GitHub javieraguileracofre/Evalua_v1.
# También puedes crear solo "Web Service" desde el mismo repo (Runtime: Docker);
# entonces este archivo sirve de referencia; variables sensibles en el panel.
#
# Transición: TENANCY_MODE=legacy usa DATABASE_URL como única base operacional.
# Modo definitivo: TENANCY_MODE=database_per_company exige IDENTITY_DATABASE_URL,
# ADMIN_POSTGRES_URL y DB_CREDENTIALS_KEY. En ese modo DATABASE_URL no es fallback.
# DATABASE_URL con db.*.supabase.co:5432 (IPv6) en Render: la app reescribe al pooler :6543;
# ajusta SUPABASE_POOLER_HOST si tu proyecto usa otro host del panel Connect.
#
# Python nativo en Render (sin Docker): el default 3.14 fuerza build Rust de pydantic-core.
# Fija versión con .python-version en la raíz o PYTHON_VERSION (evita pydantic-core build en 3.14).
#
# Deploy manual (sin commit): Settings → Deploy Hook → copiar URL en RENDER_DEPLOY_HOOK_URL
#   Local:  python tools/deploy_render.py
#   GitHub: Actions → "Render manual deploy" (secret RENDER_DEPLOY_HOOK_URL)

services:
  - type: web
    name: evalua-v1
    runtime: docker
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: TRUST_X_FORWARDED_FOR
        value: "true"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,*.onrender.com,*.evaluasoluciones.cl"
      - key: LOG_LEVEL
        value: INFO
      - key: TENANCY_MODE
        value: legacy
      # Schema: entrypoint corre alembic vía tools/upgrade_company_schema.py --legacy.
      # Nunca activar DDL implícito en arranque de producción.
      - key: AUTO_MIGRATE_ON_STARTUP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
